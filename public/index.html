<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Éclairé | Portal clínico</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#20352e;font:16px system-ui}header{background:#173c33;color:white;padding:20px clamp(18px,6vw,80px);display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}strong{letter-spacing:.17em}select,input,textarea,button{font:inherit;border:1px solid #a6b8ad;border-radius:8px;padding:9px}button{cursor:pointer;background:#1c5949;color:white}nav button{background:white;color:#245345}button[aria-current=true]{background:#245345;color:white}main{max-width:1050px;margin:auto;padding:25px 18px}nav,.row{display:flex;gap:9px;flex-wrap:wrap}section{background:white;border:1px solid #dce5dc;border-radius:14px;padding:22px;margin:16px 0}.hero{background:#e1eee3}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(32px,6vw,52px);margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}label{display:block;margin:12px 0}textarea,input:not([type=checkbox]){display:block;width:100%;margin-top:5px}small{color:#495f55}button:disabled{opacity:.55}svg{width:min(100%,480px)}.angle{background:#e1eee3;padding:25px;border-radius:8px;text-align:center}
</style><header><strong>ÉCLAIRÉ · Portal clínico</strong><label>Visão da demonstração <select id="role"><option>Paciente</option><option>Recepção</option><option>Médico</option></select></label></header><main><p><small>Demonstração com dados fictícios. Use apenas exemplos inventados. As alterações ficam neste navegador durante a sessão.</small></p><nav id="nav"></nav><div id="panel"></div><p id="notice" role="status"></p></main><script>
const $=id=>document.getElementById(id), angles=['Frente','Têmpora direita','Têmpora esquerda','Topo','Vértex'];
const cap=['Quando começou a queda e como evoluiu?','Quais áreas foram afetadas? Há sintomas no couro cabeludo?','Medicamentos em uso','Alergias a medicamentos','Suplementos de academia','Uso atual ou anterior de hormônios','Tabagismo','Sono e produtos usados','Tratamentos anteriores para queda','Sintomas intestinais (opcional)'];
const nut=['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Vontade de doces (opcional)','Bebidas alcoólicas (opcional)','Atividade física','Água por dia'];
const state={type:'Capilar',visit:'Primeira consulta',forms:{},files:[],review:false,planned:4,done:0,agenda:'25/11/2026 às 14:00',status:'A confirmar',ticket:false,invite:'Aguardando verificação',copied:false,messages:[],recipe:false};
const menus={Paciente:['Início','Cadastro','Pré-consulta','Minha Saúde','Dúvidas'],Recepção:['Agenda','Vinculação','Dúvidas'],Médico:['Fila','Revisão','Tratamento','Agenda']};let page='Início';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const act=(id,label)=>'<button data-action="'+id+'">'+label+'</button>';
const card=(title,body)=>'<section><h2>'+title+'</h2>'+body+'</section>';
const edit=(name,value,label)=>'<label>'+label+'<input data-edit="'+name+'" value="'+esc(value)+'"></label>';
const upload=(key,label,accept)=>'<label>'+label+'<input type="file" data-upload="'+key+'" accept="'+accept+'"></label>';
const files=()=>state.files.length?'<ul>'+state.files.map((f,i)=>'<li>'+esc(f.name)+' · '+esc(f.key)+' · '+(f.review?'Revisado':'Recebido')+($('role').value==='Médico'?' '+act('file:'+i,'Revisar'):'')+'</li>').join('')+'</ul>':'<p>Nenhum arquivo enviado nesta sessão.</p>';

const demoLabs=[
 ['Ferritina','Nutricional','ng/mL','18','42','A ferritina aumentou; interpretar com o hemograma e o contexto inflamatório.'],
 ['Vitamina D','Nutricional','ng/mL','19','32','A concentração aumentou entre as coletas.'],
 ['Triglicerídeos','Metabólica','mg/dL','185','125','Houve redução dos triglicerídeos; conferir as condições da coleta.'],
 ['Glicemia','Metabólica','mg/dL','89','89',''],
 ['Testosterona total','Hormonal','ng/dL','420','435',''],
 ['Proteína C reativa','Inflamatória','mg/L','2','2','']
];
function evolution(){
 const highlights=demoLabs.filter(row=>row[5]);
 return card('EVOLUÇÃO CLÍNICA','<p><small>Histórico fictício revisado. O arquivo selecionado não é analisado nesta demonstração.</small></p><h3>Principais Melhoras Obtidas</h3><ul>'+highlights.map(([n,c,u,a,b])=>'<li>✅ '+n+': '+a+' → '+b+' '+u+' ('+c.toLowerCase()+')</li>').join('')+'</ul><h3>Impacto Clínico das Melhoras</h3><div style="overflow:auto"><table><thead><tr><th scope="col">Exame</th><th scope="col">Histórico · 01/09/2026</th><th scope="col">Mais recente · 01/11/2026</th></tr></thead><tbody>'+demoLabs.map(([n,c,u,a,b])=>'<tr><th scope="row">'+n+'</th><td>'+a+' '+u+'</td><td>'+b+' '+u+'</td></tr>').join('')+'</tbody></table></div>'+highlights.map(row=>'<p>'+row[5]+'</p>').join('')+'<h3>Regras de ajuste da receita a partir dos exames</h3><p>O médico deve confirmar identidade, resultados, unidades e indicação antes de preparar a receita. Itens sem regra definida ficam pendentes.</p>');
}

function render(){const r=$('role').value;$('nav').innerHTML=menus[r].map(p=>'<button data-page="'+p+'" aria-current="'+(p===page)+'">'+p+'</button>').join('');let view='';
if(page==='Início')view='<section class="hero"><h1>Olá, Mariana.</h1><p>Acompanhe suas consultas e seus documentos em um só lugar.</p></section>'+card('Próximo agendamento',esc(state.agenda)+' · '+esc(state.status)+ '<p>'+act('prepare','Preparar minha consulta')+'</p>');
if(page==='Cadastro')view=card('Conferir cadastro',['Nome completo','CPF','Endereço','E-mail','Sexo','Data de nascimento'].map((x,i)=>edit('profile'+i,state['profile'+i]??['Mariana Almeida','000.000.000-00','Rua Fictícia, 100','mariana@example.invalid','Feminino','12/03/1989'][i],x)).join('')+act('save','Salvar conferência'));
if(page==='Pré-consulta'){let k=state.type+state.visit;state.forms[k]??={};const questions=state.type==='Capilar'?cap:state.type==='Nutrologia'?nut:[...nut,'Histórico de peso','Objetivo da consulta','Tratamentos anteriores'];view=card('Preparar consulta','<div class="row"><label>Tipo <select data-edit="type">'+['Capilar','Nutrologia','Emagrecimento'].map(x=>'<option '+(x===state.type?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Etapa <select data-edit="visit">'+['Primeira consulta','Retorno'].map(x=>'<option '+(x===state.visit?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div>'+questions.map((q,i)=>'<label>'+q+'<textarea data-answer="'+i+'">'+esc(state.forms[k][i])+'</textarea></label>').join('')+act('save','Salvar progresso'))+card('Exames',upload('Exame','PDF ou imagem da galeria','application/pdf,image/*')+'<label>Câmera do celular<input type="file" data-upload="Exame" accept="image/*" capture="environment"></label>'+files())+card('Fotos clínicas','<p>Use luz uniforme, mantenha a câmera na altura indicada e repita a distância e o enquadramento no retorno. Evite filtros.</p><div class="grid">'+(state.type==='Capilar'?angles:['Frente','Perfil','Costas']).map(a=>upload(a+' · '+state.visit,a,'image/*')).join('')+'</div>');}
if(page==='Minha Saúde')view=card('Meus exames',files()+'<h3>Ferritina (exemplo)</h3>'+(state.review?'<svg viewBox="0 0 360 100" role="img" aria-label="Ferritina de 35 a 42 nanogramas por mililitro"><path d="M40 75 L310 30" stroke="#267459" fill="none" stroke-width="4"/><circle cx="40" cy="75" r="6" fill="#267459"/><circle cx="310" cy="30" r="6" fill="#267459"/></svg><p>01/09/2026: 35 ng/mL · 01/11/2026: 42 ng/mL</p>':'<p>O resultado de novembro aguarda revisão. Resultado de setembro: 35 ng/mL.</p>'))+card('Evolução fotográfica',angles.map(a=>'<p>'+a+' · '+state.files.filter(f=>f.key.startsWith(a+' ·')).map(f=>esc(f.key.split(' · ')[1])+': '+esc(f.name)).join(' | ')+'</p>').join(''))+card('Receitas',state.recipe?'<a download="receita-demonstracao.txt" href="data:text/plain,Documento%20fict%C3%ADcio%20para%20demonstra%C3%A7%C3%A3o">Baixar documento fictício</a>':'<p>Aguardando liberação.</p>')+card('Meu tratamento',state.planned+' recomendadas · '+state.done+' realizadas · '+Math.max(0,state.planned-state.done)+' restantes')+card('Prontuário completo',state.ticket?'Solicitação demonstrativa registrada.':act('ticket','Solicitar cópia'));
if(page==='Dúvidas')view=card('Dúvidas administrativas','<p>O canal clínico está indisponível. Para urgências, procure atendimento imediato.</p><label>Mensagem fictícia<textarea id="msg"></textarea></label><label>Anexo demonstrativo<input id="attach" type="file"></label>'+act('message','Registrar mensagem')+state.messages.map(m=>'<p>'+esc(m)+'</p>').join(''));
if(page==='Agenda')view=card('Consulta ou procedimento',edit('agenda',state.agenda,'Data e horário')+edit('kind',state.kind??'Consulta capilar','Tipo de atendimento')+esc(state.status)+' <div class="row">'+act('confirm','Confirmar')+act('reschedule','Salvar remarcação')+'</div>');
if(page==='Vinculação')view=card('Vinculação cadastral','<p>Mariana Almeida · '+esc(state.invite)+'</p><p>Confirme a identidade antes de vincular o histórico. Endereço de e-mail coincidente requer conferência.</p><div class="row">'+act('invite','Simular convite / reenvio')+act('flag','Encaminhar divergência')+act('link','Confirmar vínculo fictício')+'</div>');
if(page==='Fila')view=card('Pacientes sob meus cuidados','<p>Mariana Almeida · '+esc(state.type)+' · '+esc(state.visit)+'</p>'+act('review','Abrir revisão'));
if(page==='Revisão')view='<div class="grid">'+card('Original · laudo fictício','<p>Página 1 · coleta 01/11/2026</p><p>Ferritina: 42 ng/mL</p><p>Segundo resultado: trecho ilegível.</p>'+upload('Exame do médico','Adicionar exame fictício','application/pdf,image/*')+files())+card('Minuta para o Feegow','<h3>Relato do paciente</h3>'+Object.entries(state.forms[state.type+state.visit]??{}).map(([i,v])=>'<p>'+esc((state.type==='Capilar'?cap:nut)[i]??'Informação adicional')+': '+esc(v)+'</p>').join('')+'<h3>Resultado extraído</h3><p>Ferritina 42 ng/mL · laudo fictício, p. 1 · '+(state.review?'Revisado':'Pendente')+'</p>'+act('publish','Validar resultado demonstrativo')+'<label>Avaliação médica fictícia<textarea data-edit="assessment">'+esc(state.assessment)+'</textarea></label>'+act('copy',state.copied?'Cópia manual confirmada':'Confirmar cópia manual'))+'</div>'+card('Receita já assinada',upload('Receita','Selecionar receita fictícia','application/pdf')+act('recipe','Liberar documento fictício'));
if(page==='Revisão'){
 const uploaded=state.files.some(file=>file.key==='Exame do médico');
 view+=card('Evolução dos exames',uploaded?act('evolution','Gerar evolução clínica'):'<p>Adicione um exame fictício para habilitar o botão.</p>');
 if(uploaded&&state.evolution)view+=evolution();
}
if(page==='Tratamento')view=card('Plano individual',edit('treatment',state.treatment??'Aplicação demonstrativa','Tipo de tratamento')+'<label>Aplicações recomendadas<input type="number" min="'+state.done+'" value="'+state.planned+'" data-edit="planned"></label><p>'+state.done+' realizadas · '+Math.max(0,state.planned-state.done)+' restantes</p>'+act('application','Registrar aplicação'));
$('panel').innerHTML=view;}
$('role').onchange=()=>{page=menus[$('role').value][0];render()};
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.answer!==undefined)state.forms[state.type+state.visit][t.dataset.answer]=t.value;const k=t.dataset.edit;if(k&&t.tagName!=='SELECT')state[k]=k==='planned'?Math.max(state.done,Number(t.value)):t.value;});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.edit){state[t.dataset.edit]=t.value;render()}if(t.dataset.upload&&t.files[0]){const f=t.files[0];if(f.size>10*1024*1024||!(/^(application\/pdf|image\/)/.test(f.type))){$('notice').textContent='Selecione PDF ou imagem de até 10 MB.';return}state.files.push({name:f.name,key:t.dataset.upload,review:false});render();$('notice').textContent='Arquivo registrado para demonstração nesta sessão.'}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page){page=t.dataset.page;render();return}const a=t.dataset.action;if(!a)return;let note='Alteração registrada nesta demonstração.';if(a==='prepare')page='Pré-consulta';if(a==='review')page='Revisão';if(a==='invite')state.invite='Convite simulado';if(a==='flag')state.invite='Em revisão manual';if(a==='link')state.invite='Vínculo fictício conferido';if(a==='confirm')state.status='Confirmado';if(a==='reschedule')state.status='Remarcado';if(a==='evolution')state.evolution=true;if(a==='publish')state.review=true;if(a==='copy')state.copied=true;if(a==='recipe')state.recipe=true;if(a==='ticket')state.ticket=true;if(a==='application'&&state.done<state.planned)state.done++;if(a.startsWith('file:'))state.files[Number(a.slice(5))].review=true;if(a==='message'){const m=$('msg').value.trim();if(!m){$('notice').textContent='Escreva uma mensagem fictícia.';return}state.messages.push(m+($('attach').files[0]?' · '+$('attach').files[0].name:''));}render();$('notice').textContent=note;});render();
</script></html>
