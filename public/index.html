function wordZip(files){
 const encoder=new TextEncoder(),local=[],central=[];let offset=0;
 function header(size,fields){const result=new Uint8Array(size),view=new DataView(result.buffer);
 for(const [position,value,width] of fields){if(width===2)view.setUint16(position,value,true);else view.setUint32(position,value,true);}
 return result;}
 for(const [name,content] of Object.entries(files)){
 const key=encoder.encode(name),data=typeof content==='string'?encoder.encode(content):content;
 let crc=0xffffffff;for(const byte of data){crc^=byte;for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}crc=(~crc)>>>0;
 local.push(header(30,[[0,0x04034b50],[4,20,2],[6,2048,2],[14,crc],[18,data.length],[22,data.length],[26,key.length,2]]),key,data);
 central.push(header(46,[[0,0x02014b50],[4,20,2],[6,20,2],[8,2048,2],[16,crc],[20,data.length],[24,data.length],[28,key.length,2],[42,offset]]),key);
 offset+=30+key.length+data.length;
 }
 const count=central.length/2,size=central.reduce((sum,a)=>sum+a.length,0);
 return new Blob([...local,...central,header(22,[[0,0x06054b50],[8,count,2],[10,count,2],[12,size],[16,offset]])]);
}

function makeWord(kind, content, date, isModel=false){
 const paragraph=(value,{size=22,color='20352E',bold=false,center=false,after=110}={})=>{
  const clean=value.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\ufffe\uffff]/g,'');

   '</w:pPr><w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>'+ (bold?'<w:b/>':'')+
   '<w:color w:val="'+color+'"/><w:sz w:val="'+size+'"/></w:rPr><w:t xml:space="preserve">'+esc(clean)+'</w:t></w:r></w:p>';
 };
 const heading={bold:true,color:'245345',after:90};
 const title=kind==='recipe'?'RECEITA':'EVOLUÇÃO CLÍNICA';
 let body=paragraph(title,{...heading,size:34,center:true,after:170});
 if(isModel)body+=paragraph(kind==='recipe'?'PARA [Nome do paciente]':'[Nome do paciente] · [Idade] · [Período] · [Data dos exames]',{...heading,center:kind==='report'});
 const lines=content.replace(/\\r\\n|\\n/g,'\n').split(/\r?\n/).map(line=>line.trim().replace(/^\s{0,3}#{1,6}\s+/,'').replace(/\*\*([^*]+)\*\*/g,'$1'));
 if(isModel&&kind==='recipe'&&!lines.some(line=>/^MANIPULE:?$/iu.test(line)))body+=paragraph('MANIPULE',heading);
 for(const line of lines){
  if(!line||line.toLocaleUpperCase('pt-BR')===title)continue;
  body+=paragraph(line.replace(/^[-*]\s+/,'• '),clinicHeadings.test(line)?{...heading,center:kind==='recipe'&&/^Uso\b/iu.test(line)}:{});
 }
 body+=paragraph(date,{after:150});
 if(kind==='recipe'){
  body+=paragraph('Éclairé',{...heading,center:true});
  body+=paragraph('Rua Euclides da Cunha, 610 · Bigorrilho · Curitiba · CEP 80730-360',{size:18,center:true,after:60});
  body+=paragraph('Central de Atendimento +55 41 99600-8979 / +1 321 343 9914 (USA)',{size:18,center:true});
 }
 const page='<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="1100" w:bottom="1000" w:left="1100"/></w:sectPr>';
 return wordZip({
 '[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>',
 '_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>',

 });

async function fillOriginalRecipe(file,patient,content,date){
 const bytes=new Uint8Array(await file.arrayBuffer()), view=new DataView(bytes.buffer);
 const xmlPath='word/document.xml', decoder=new TextDecoder();
 let end=bytes.length-22;
 while(end>=Math.max(0,bytes.length-65557)&&view.getUint32(end,true)!==0x06054b50)end--;
 if(end<Math.max(0,bytes.length-65557))throw Error('O modelo não é um Word válido.');
 let offset=view.getUint32(end+16,true), total=0;
 const files=Object.create(null);
 for(let i=0;i<view.getUint16(end+10,true);i++){
  if(view.getUint32(offset,true)!==0x02014b50)throw Error('O modelo Word está danificado.');
  const method=view.getUint16(offset+10,true),length=view.getUint16(offset+28,true);
  const name=decoder.decode(bytes.subarray(offset+46,offset+46+length));
  const size=view.getUint32(offset+20,true), expanded=view.getUint32(offset+24,true), local=view.getUint32(offset+42,true);
  total+=expanded;
  if(total>40*1024*1024||![0,8].includes(method)||view.getUint16(offset+8,true)&1)throw Error('Formato de modelo Word não suportado.');
  if(view.getUint32(local,true)!==0x04034b50)throw Error('O modelo Word está danificado.');
  const start=local+30+view.getUint16(local+26,true)+view.getUint16(local+28,true);
  const packed=bytes.subarray(start,start+size);
  const data=method===0?packed:new Uint8Array(await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  if(data.length!==expanded)throw Error('O modelo Word está danificado.');
  files[name]=data;
  offset+=46+length+view.getUint16(offset+30,true)+view.getUint16(offset+32,true);
 }
 if(!files[xmlPath])throw Error('O modelo não contém o documento principal.');
 const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 const xml=new DOMParser().parseFromString(decoder.decode(files[xmlPath]),'application/xml');
 const body=xml.getElementsByTagNameNS(ns,'body')[0];
 if(!body)throw Error('O texto do modelo Word não pôde ser lido.');
 const paragraphs=Array.from(body.children).filter(p=>p.namespaceURI===ns&&p.localName==='p');
 const textOf=p=>Array.from(p.getElementsByTagNameNS(ns,'t')).map(t=>t.textContent).join('').trim();
 const names=paragraphs.filter(p=>/^PARA\s*:?$/iu.test(textOf(p)));
 const dates=paragraphs.filter(p=>/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(textOf(p)));
 const blocks=paragraphs.filter(p=>/^MANIPULE\s*:?$/iu.test(textOf(p)));
 if(names.length!==2||dates.length!==2||blocks.length!==2)throw Error('Selecione o PRESCRIPTION TEMPLATE CABELO original de duas páginas.');
 function setText(paragraph,text){
  const nodes=Array.from(paragraph.getElementsByTagNameNS(ns,'t'));
  if(!nodes.length)throw Error('O modelo original tem um campo sem formatação reconhecível.');
  nodes[0].setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
  nodes[0].textContent=text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\ufffe\uffff]/g,'');
  nodes.slice(1).forEach(node=>{node.textContent='';});
 }
 const lines=content.replace(/\\r\\n|\\n/g,'\n').split(/\r?\n/).map(l=>l.trim().replace(/\*\*/g,'').replace(/^#{1,6}\s+/,'')).filter(l=>l&&!/^PARA(?:\s*:\s*|\s+)|^MANIPULE\s*:?$|^MINUTA\b|^Fórmula, dose e posologia: a preencher pelo médico\.?$/iu.test(l));
 const first=[],second=[];
 let target=first;
 for(const line of lines){
  if(/^Fórmula\s+\d+/iu.test(line))target=first;
  if(/^(?:[•⮚*-]\s*)?minoxidil\b/iu.test(line)){
   if(!/\d/.test(line)||/^(?:[•⮚*-]\s*)?minoxidil\s+tópico/iu.test(line))throw Error('Confira a apresentação do minoxidil antes de exportar.');
   target=second;
  }
  target.push(line);
 }
 names.forEach(p=>setText(p,'PARA '+patient));
 dates.forEach(p=>setText(p,date));
 for(const [i,part] of [first,second].entries()){
  if(i===1&&!part.length)continue;
  const start=paragraphs.indexOf(blocks[i]), stop=paragraphs.indexOf(dates[i]);
  const slots=paragraphs.slice(start+1,stop).filter(p=>textOf(p));
  if(!slots.length)throw Error('Os campos da fórmula não foram encontrados.');
  function paragraphStyle(source){
   const paragraph=xml.createElementNS(ns,'w:p');
   const properties=Array.from(source.children).find(node=>node.namespaceURI===ns&&node.localName==='pPr');
   if(properties){
    const style=properties.cloneNode(true);
    for(const tag of ['pageBreakBefore','sectPr','pPrChange']){
     Array.from(style.getElementsByTagNameNS(ns,tag)).forEach(node=>node.remove());
    }
    paragraph.appendChild(style);
   }
   const run=xml.createElementNS(ns,'w:r');
   const originalText=source.getElementsByTagNameNS(ns,'t')[0];
   const originalRun=originalText?.parentElement;
   const runStyle=Array.from(originalRun?.children||[]).find(node=>node.namespaceURI===ns&&node.localName==='rPr');
   if(runStyle)run.appendChild(runStyle.cloneNode(true));
   run.appendChild(xml.createElementNS(ns,'w:t'));
   paragraph.appendChild(run);
   return paragraph;
  }
  const prototypes={
   title:paragraphStyle(slots[0]),
   item:paragraphStyle(slots.find(p=>/^\s*(?:Vit |Dutasterida|Minoxidil)/iu.test(textOf(p)))||slots[0]),
   instruction:paragraphStyle(slots.find(p=>/^Tomar\b/iu.test(textOf(p)))||slots[0])
  };
  const anchor=slots[0];
  for(const line of part){
   const key=/^(?:Fórmula|Uso|MINUTA)/iu.test(line)?'title':/^(?:QSP|Tomar|Aplicar|Pendência)/iu.test(line)?'instruction':'item';
   const p=prototypes[key].cloneNode(true);
   if(key==='item'&&p.getElementsByTagNameNS(ns,'numPr').length) setText(p,line.replace(/^[•⮚*-]\s*/u,''));
   else setText(p,line);
   body.insertBefore(p,anchor);
  }
  for(const p of slots)p.remove();
 }
 if(!second.length){
  const firstDate=paragraphs.indexOf(dates[0]), next=paragraphs.indexOf(names[1]);
  const secondHeader=paragraphs.slice(firstDate+1,next).findLastIndex(p=>p.getElementsByTagNameNS(ns,'drawing').length);
  if(secondHeader<0)throw Error('A segunda página do modelo não pôde ser identificada.');
  for(const p of paragraphs.slice(firstDate+1+secondHeader))p.remove();
 }
 files[xmlPath]=new XMLSerializer().serializeToString(xml);
 return wordZip(files);
}
function templateStorage(operation,file){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open('eclaire-clinic-template',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('models');
  request.onerror=()=>reject(request.error);
  request.onblocked=()=>reject(new Error('Armazenamento bloqueado.'));
  request.onsuccess=()=>{
   const db=request.result;
   const tx=db.transaction('models',operation==='read'?'readonly':'readwrite');
   const models=tx.objectStore('models');
   const result=operation==='read'?models.get('capilar'):operation==='remove'?models.delete('capilar'):models.put(file,'capilar');
   tx.oncomplete=()=>{db.close();resolve(result.result);};
   tx.onabort=()=>{db.close();reject(tx.error||new Error('Falha ao gravar modelo.'));};
  };
 });
}

async function downloadDraft(kind){

 const safeName=patient?.replace(/[<>:"/\\|?*\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().slice(0,140);

if(page==='Início')view='<section class="hero"><h1>Olá, Mariana.</h1><p>Acompanhe suas consultas e seus documentos em um só lugar.</p></section>'+card('Próximo agendamento',esc(state.agenda)+' · '+esc(state.status)+ '<p>'+act('prepare','Preparar minha consulta')+'</p>');

if(page==='Pré-consulta'){let k=state.type+state.visit;state.forms[k]??={};const questions=state.type==='Capilar'?cap:state.type==='Nutrologia'?nut:[...nut,'Histórico de peso','Objetivo da consulta','Tratamentos anteriores'];view=card('Preparar consulta','<div class="row"><label>Tipo <select data-edit="type">'+['Capilar','Nutrologia','Emagrecimento'].map(x=>'<option '+(x===state.type?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Etapa <select data-edit="visit">'+['Primeira consulta','Retorno'].map(x=>'<option '+(x===state.visit?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div>'+questions.map((q,i)=>'<label>'+q+'<textarea data-answer="'+i+'">'+esc(state.forms[k][i])+'</textarea></label>').join('')+act('save','Salvar progresso'))+card('Exames',upload('Exame','PDF ou imagem da galeria','application/pdf,image/*')+'<label>Câmera do celular<input type="file" data-upload="Exame" accept="image/*" capture="environment"></label>'+files())+card('Fotos clínicas','<p>Use luz uniforme, mantenha a câmera na altura indicada e repita a distância e o enquadramento no retorno. Evite filtros.</p><div class="grid">'+(state.type==='Capilar'?angles:['Frente','Perfil','Costas']).map(a=>upload(a+' · '+state.visit,a,'image/*')).join('')+'</div>');}
if(page==='Minha Saúde')view=card('Meus exames',files()+'<h3>Ferritina (exemplo)</h3>'+(state.review?'<svg viewBox="0 0 360 100" role="img" aria-label="Ferritina de 35 a 42 nanogramas por mililitro"><path d="M40 75 L310 30" stroke="#267459" fill="none" stroke-width="4"/><circle cx="40" cy="75" r="6" fill="#267459"/><circle cx="310" cy="30" r="6" fill="#267459"/></svg><p>01/09/2026: 35 ng/mL · 01/11/2026: 42 ng/mL</p>':'<p>O resultado de novembro aguarda revisão. Resultado de setembro: 35 ng/mL.</p>'))+card('Evolução fotográfica',angles.map(a=>'<p>'+a+' · '+state.files.filter(f=>f.key.startsWith(a+' ·')).map(f=>esc(f.key.split(' · ')[1])+': '+esc(f.name)).join(' | ')+'</p>').join(''))+card('Receitas',state.recipe?'<a download="receita-demonstracao.txt" href="data:text/plain,Documento%20fict%C3%ADcio%20para%20demonstra%C3%A7%C3%A3o">Baixar documento fictício</a>':'<p>Aguardando liberação.</p>')+card('Meu tratamento',state.planned+' recomendadas · '+state.done+' realizadas · '+Math.max(0,state.planned-state.done)+' restantes')+card('Prontuário completo',state.ticket?'Solicitação demonstrativa registrada.':act('ticket','Solicitar cópia'));
if(page==='Dúvidas')view=card('Dúvidas administrativas','<p>O canal clínico está indisponível. Para urgências, procure atendimento imediato.</p><label>Mensagem fictícia<textarea id="msg"></textarea></label><label>Anexo demonstrativo<input id="attach" type="file"></label>'+act('message','Registrar mensagem')+state.messages.map(m=>'<p>'+esc(m)+'</p>').join(''));
if(page==='Agenda')view=card('Consulta ou procedimento',edit('agenda',state.agenda,'Data e horário')+edit('kind',state.kind??'Consulta capilar','Tipo de atendimento')+esc(state.status)+' <div class="row">'+act('confirm','Confirmar')+act('reschedule','Salvar remarcação')+'</div>');
if(page==='Fila')view=card('Pacientes sob meus cuidados','<p>Mariana Almeida · '+esc(state.type)+' · '+esc(state.visit)+'</p>'+act('review','Abrir revisão'));
if(page==='Revisão')view='<div class="grid">'+card('Original · laudo fictício','<p>Página 1 · coleta 01/11/2026</p><p>Ferritina: 42 ng/mL</p><p>Segundo resultado: trecho ilegível.</p>'+upload('Exame do médico','Adicionar exame fictício','application/pdf,image/*')+files())+card('Minuta para o Feegow','<h3>Relato do paciente</h3>'+Object.entries(state.forms[state.type+state.visit]??{}).map(([i,v])=>'<p>'+esc((state.type==='Capilar'?cap:nut)[i]??'Informação adicional')+': '+esc(v)+'</p>').join('')+'<h3>Resultado extraído</h3><p>Ferritina 42 ng/mL · laudo fictício, p. 1 · '+(state.review?'Revisado':'Pendente')+'</p>'+act('publish','Validar resultado demonstrativo')+'<label>Avaliação médica fictícia<textarea data-edit="assessment">'+esc(state.assessment)+'</textarea></label>'+act('copy',state.copied?'Cópia manual confirmada':'Confirmar cópia manual'))+'</div>'+card('Receita já assinada',upload('Receita','Selecionar receita fictícia','application/pdf')+act('recipe','Liberar documento fictício'));
if(page==='Revisão'){
 const uploaded=state.files.some(file=>file.key==='Exame do médico');
 view+=card('Evolução dos exames',uploaded?act('evolution','Gerar evolução clínica'):'<p>Adicione um exame fictício para habilitar o botão.</p>');
 if(uploaded&&state.evolution)view+=evolution();
}
if(page==='Documentos')view=documentDraft();
if(page==='Configurações')view=card('Modelos da clínica',Object.entries(clinicModels).map(([kind,model])=>'<h3>'+esc(model.name)+'</h3><p>'+esc(model.description)+'</p>'+act('model:'+kind,'Baixar modelo Word')).join(''))+card(state.sharedTemplate?'Modelo original compartilhado pela clínica':'Modelo original salvo neste navegador',
 '<p>Modelo de receita capilar em Word.</p><p><small>Demonstração local: o modelo fica disponível nesta aba até você fechar ou recarregar. Use um arquivo em branco, sem dados de pacientes.</small></p>'+
 (state.sharedTemplate?'':'<label>'+ (state.template?'Substituir modelo':'Selecionar modelo')+'<input type="file" id="clinic-template" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label>')+
 (state.template?'<p><strong>Modelo selecionado</strong><br>'+esc(state.template.name)+'</p><div class="row">'+act('template-download','Baixar original')+(state.sharedTemplate?'':act('template-remove','Retirar seleção'))+'</div>':'<p>Nenhum modelo selecionado.</p>'));
if(page==='Tratamento')view=card('Plano individual',edit('treatment',state.treatment??'Aplicação demonstrativa','Tipo de tratamento')+'<label>Aplicações recomendadas<input type="number" min="'+state.done+'" value="'+state.planned+'" data-edit="planned"></label><p>'+state.done+' realizadas · '+Math.max(0,state.planned-state.done)+' restantes</p>'+act('application','Registrar aplicação'));
$('panel').innerHTML=view;}
$('role').onchange=()=>{page=menus[$('role').value][0];render()};
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.answer!==undefined)state.forms[state.type+state.visit][t.dataset.answer]=t.value;const k=t.dataset.edit;if(k&&t.tagName!=='SELECT')state[k]=k==='planned'?Math.max(state.done,Number(t.value)):t.value;});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='clinic-template'){
 const file=t.files?.[0];if(!file)return;
 if(!/\.docx$/i.test(file.name)||file.size<4||file.size>15*1024*1024){$('notice').textContent='Selecione um arquivo .docx de até 15 MB.';return}
 const signature=new Uint8Array(await file.slice(0,4).arrayBuffer());
 if(signature.join(',')!=='80,75,3,4'){$('notice').textContent='O arquivo não parece ser um documento Word válido.';return}
 await templateReady;
 try{await templateStorage('save',file);state.template=file;render();$('notice').textContent='Modelo original salvo para as próximas receitas neste navegador.';}
 catch{$('notice').textContent='Não foi possível salvar o modelo neste navegador.';}return;
 }if(t.tagName==='SELECT'&&t.dataset.edit){state[t.dataset.edit]=t.value;render()}if(t.dataset.upload&&t.files[0]){const f=t.files[0];if(f.size>10*1024*1024||!(/^(application\/pdf|image\/)/.test(f.type))){$('notice').textContent='Selecione PDF ou imagem de até 10 MB.';return}state.files.push({name:f.name,key:t.dataset.upload,review:false});render();$('notice').textContent='Arquivo registrado para demonstração nesta sessão.'}});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page){page=t.dataset.page;render();return}const a=t.dataset.action;if(!a)return;if(a==='model:recipe'||a==='model:report'){downloadClinicModel(a.slice(6));return;}let note='Alteração registrada nesta demonstração.';if(a==='download-recipe'||a==='download-report'){downloadDraft(a==='download-recipe'?'recipe':'report');return;}if(a==='template-download'&&state.template){
 const url=URL.createObjectURL(state.template);const link=document.createElement('a');link.href=url;link.download=state.template.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;
 }if(a==='template-remove'){await templateReady;try{await templateStorage('remove');delete state.template;note='Modelo retirado deste navegador.';}catch{note='Não foi possível retirar o modelo.';}}if(a==='prepare')page='Pré-consulta';if(a==='review')page='Revisão';if(a==='confirm')state.status='Confirmado';if(a==='reschedule')state.status='Remarcado';if(a==='evolution')state.evolution=true;if(a==='publish')state.review=true;if(a==='copy')state.copied=true;if(a==='recipe')state.recipe=true;if(a==='ticket')state.ticket=true;if(a==='application'&&state.done<state.planned)state.done++;if(a.startsWith('file:'))state.files[Number(a.slice(5))].review=true;if(a==='message'){const m=$('msg').value.trim();if(!m){$('notice').textContent='Escreva uma mensagem fictícia.';return}state.messages.push(m+($('attach').files[0]?' · '+$('attach').files[0].name:''));}render();$('notice').textContent=note;});render();
</script></html>
